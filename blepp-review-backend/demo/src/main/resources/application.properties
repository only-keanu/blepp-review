spring.application.name=demo
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=${SERVER_PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=framework
server.tomcat.connection-timeout=${SERVER_CONNECTION_TIMEOUT:10s}
server.tomcat.max-http-form-post-size=${SERVER_MAX_HTTP_FORM_POST_SIZE:2MB}
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:10MB}
spring.lifecycle.timeout-per-shutdown-phase=${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:20s}
logging.pattern.level=%5p [request_id:%X{request_id:-none}]

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://blepp-review.vercel.app,https://localhost,capacitor://localhost}
app.generation.connect-timeout-seconds=${APP_GENERATION_CONNECT_TIMEOUT_SECONDS:10}
app.generation.read-timeout-seconds=${APP_GENERATION_READ_TIMEOUT_SECONDS:60}
app.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}
app.rate-limit.auth-capacity=${APP_RATE_LIMIT_AUTH_CAPACITY:10}
app.rate-limit.auth-window-seconds=${APP_RATE_LIMIT_AUTH_WINDOW_SECONDS:60}
app.rate-limit.refresh-capacity=${APP_RATE_LIMIT_REFRESH_CAPACITY:30}
app.rate-limit.refresh-window-seconds=${APP_RATE_LIMIT_REFRESH_WINDOW_SECONDS:60}
app.rate-limit.generation-capacity=${APP_RATE_LIMIT_GENERATION_CAPACITY:10}
app.rate-limit.generation-window-seconds=${APP_RATE_LIMIT_GENERATION_WINDOW_SECONDS:3600}
app.rate-limit.study-write-capacity=${APP_RATE_LIMIT_STUDY_WRITE_CAPACITY:120}
app.rate-limit.study-write-window-seconds=${APP_RATE_LIMIT_STUDY_WRITE_WINDOW_SECONDS:60}
