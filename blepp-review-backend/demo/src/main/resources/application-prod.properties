# Production must provide these values through the runtime environment.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:9}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# JWT (base64-encoded 256-bit secret)
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-expiration-minutes=${APP_JWT_ACCESS_EXPIRATION_MINUTES:30}
app.jwt.refresh-expiration-minutes=${APP_JWT_REFRESH_EXPIRATION_MINUTES:43200}

# OAuth
app.oauth.connect-timeout-seconds=${APP_OAUTH_CONNECT_TIMEOUT_SECONDS:5}
app.oauth.read-timeout-seconds=${APP_OAUTH_READ_TIMEOUT_SECONDS:10}
app.oauth.google.client-id=${APP_OAUTH_GOOGLE_CLIENT_ID:}
app.oauth.google.client-secret=${APP_OAUTH_GOOGLE_CLIENT_SECRET:}
app.oauth.facebook.app-id=${APP_OAUTH_FACEBOOK_APP_ID:}
app.oauth.facebook.app-secret=${APP_OAUTH_FACEBOOK_APP_SECRET:}

# Comma-separated admin bootstrap emails, e.g. APP_ADMIN_EMAILS=email1@example.com,email2@example.com
app.admin.emails=${APP_ADMIN_EMAILS:}

# AI generation
app.openai.api-key=${APP_OPENAI_API_KEY:}
app.openai.model=${APP_OPENAI_MODEL:gpt-4o-mini}
app.generation.upload-dir=${APP_GENERATION_UPLOAD_DIR:uploads/generation}
app.generation.max-pdf-bytes=${APP_GENERATION_MAX_PDF_BYTES:10485760}
app.generation.connect-timeout-seconds=${APP_GENERATION_CONNECT_TIMEOUT_SECONDS:10}
app.generation.read-timeout-seconds=${APP_GENERATION_READ_TIMEOUT_SECONDS:60}
