# Production must provide these values through the runtime environment.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:9}

# JWT (base64-encoded 256-bit secret)
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-expiration-minutes=${APP_JWT_ACCESS_EXPIRATION_MINUTES:30}
app.jwt.refresh-expiration-minutes=${APP_JWT_REFRESH_EXPIRATION_MINUTES:43200}

# OAuth
app.oauth.google.client-id=${APP_OAUTH_GOOGLE_CLIENT_ID:}
app.oauth.google.client-secret=${APP_OAUTH_GOOGLE_CLIENT_SECRET:}
app.oauth.facebook.app-id=${APP_OAUTH_FACEBOOK_APP_ID:}
app.oauth.facebook.app-secret=${APP_OAUTH_FACEBOOK_APP_SECRET:}

# Comma-separated admin bootstrap emails, e.g. APP_ADMIN_EMAILS=email1@example.com,email2@example.com
app.admin.emails=${APP_ADMIN_EMAILS:}
